name: Build Minimal VM Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wget cpio gzip patch bc flex bison git

    - name: Run Build Pipeline
      run: |
        chmod +x scripts/*.sh
        make all

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-vm-browser-exe
        path: bin/minimal_browser_vm.exe