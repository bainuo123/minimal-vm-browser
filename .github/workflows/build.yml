name: Build Minimal VM Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        # 补全了编译 x86_64-mingw32 交叉 QEMU 核心所需的宿主机本地依赖库
        sudo apt-get install -y build-essential gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
          wget cpio gzip patch bc flex bison git pkg-config libglib2.0-dev libpixman-1-dev

    - name: Run Build Pipeline
      env:
        TERM: xterm-256color
      run: |
        chmod +x scripts/*.sh
        make all

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-vm-browser-exe
        path: bin/minimal_browser_vm.exe