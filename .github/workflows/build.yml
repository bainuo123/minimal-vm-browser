name: Build Minimal VM Browser

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =============================================================================
    # Checkout
    # =============================================================================
    - name: Checkout code
      uses: actions/checkout@v4

    # =============================================================================
    # Install Dependencies
    # =============================================================================
    - name: Install Dependencies
      run: |
        sudo apt-get update

        # =========================================================================
        # 基础构建工具
        # =========================================================================
        sudo apt-get install -y \
          build-essential \
          git \
          wget \
          curl \
          unzip \
          xz-utils \
          zstd \
          cpio \
          gzip \
          patch \
          bc \
          flex \
          bison \
          python3 \
          texinfo

        # =========================================================================
        # MinGW Windows 交叉编译工具链
        # =========================================================================
        sudo apt-get install -y \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          binutils-mingw-w64-x86-64 \
          mingw-w64-tools

        # =========================================================================
        # QEMU / GLib / Pixman
        # =========================================================================
        sudo apt-get install -y \
          pkg-config \
          meson \
          ninja-build \
          libglib2.0-dev \
          libpixman-1-dev \
          qemu-system-x86

        # =========================================================================
        # Linux Kernel 构建依赖
        # =========================================================================
        sudo apt-get install -y \
          libelf-dev \
          libssl-dev \
          dwarves

    # =============================================================================
    # Build Pipeline
    # =============================================================================
    - name: Run Build Pipeline
      env:
        TERM: xterm-256color

        # 允许 mingw 交叉 pkg-config
        PKG_CONFIG_PATH: /usr/x86_64-w64-mingw32/lib/pkgconfig
        PKG_CONFIG_ALLOW_CROSS: "1"

      run: |
        set -euxo pipefail

        echo "=================================================="
        echo "[+] Preparing Environment"
        echo "=================================================="

        # 某些旧版 QEMU configure 会查找 pkg-config-cross
        sudo ln -sf \
          /usr/bin/x86_64-w64-mingw32-pkg-config \
          /usr/bin/pkg-config-cross || true

        chmod +x scripts/*.sh

        echo "=================================================="
        echo "[+] Build Kernel"
        echo "=================================================="

        ./scripts/build_kernel.sh

        echo "=================================================="
        echo "[+] Verify Kernel"
        echo "=================================================="

        find . -name "vmlinuz" || true
        ls -lh src/ || true

        echo "=================================================="
        echo "[+] Build Initramfs"
        echo "=================================================="

        ./scripts/build_initramfs.sh

        echo "=================================================="
        echo "[+] Build QEMU"
        echo "=================================================="

        ./scripts/build_qemu.sh

        echo "=================================================="
        echo "[+] Final Build"
        echo "=================================================="

        make all

    # =============================================================================
    # Upload EXE Artifact
    # =============================================================================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4

      with:
        name: minimal-vm-browser-exe
        path: |
          bin/minimal_browser_vm.exe
          src/vmlinuz