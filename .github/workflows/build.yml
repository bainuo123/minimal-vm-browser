name: Build Minimal VM Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        # 1. 基础编译工具链与本地检查库（确保 build_all.sh 的 check_system_deps 顺利通过）
        sudo apt-get install -y build-essential gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 \
          wget cpio gzip patch bc flex bison git pkg-config libglib2.0-dev libpixman-1-dev
          
        # 2. 交叉编译 Windows 目标所需的必备工具
        sudo apt-get install -y mingw-w64-tools

    - name: Run Build Pipeline
      env:
        TERM: xterm-256color
        # 3. 显式指定交叉编译时的包搜寻路径，防止配置阶段混淆本地库与 Windows 库
        PKG_CONFIG_PATH: /usr/x86_64-w64-mingw32/lib/pkgconfig
        PKG_CONFIG_ALLOW_CROSS: "1"
      run: |
        # 建立软链接，防止某些老版本 QEMU 脚本找不到交叉探测器
        sudo ln -s /usr/bin/x86_64-w64-mingw32-pkg-config /usr/bin/pkg-config-cross || true
        
        chmod +x scripts/*.sh
        make all

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimal-vm-browser-exe
        path: bin/minimal_browser_vm.exe